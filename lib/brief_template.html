<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{TITLE}</title>
<style>
  :root{
    --ink:#1d2430; --muted:#66707e; --line:#e6eaf0; --bg:#f8f9fb; --card:#fff;
    --accent:#2c5cc5; --good:#1f8a4c; --bad:#c0392b; --warn:#b7791f;
    --good-bg:#edf7f0; --bad-bg:#fbeeec; --accent-bg:#eef3fc; --warn-bg:#fbf4e5;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .wrap{max-width:820px;margin:0 auto;padding:48px 24px 80px;}
  h1{font-size:28px;line-height:1.2;margin:0 0 2px;letter-spacing:-.01em;}
  .sub{color:var(--muted);font-size:14px;margin:0 0 26px;}
  h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
     margin:40px 0 12px;font-weight:700;}
  p{margin:10px 0;} b{color:var(--ink);}
  code{background:#eef1f6;border-radius:4px;padding:1px 5px;font-size:.85em;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
  .term{font-weight:700;color:var(--accent);}
  .banner{background:var(--good-bg);border:1px solid #bfe4cd;border-left:5px solid var(--good);
    border-radius:12px;padding:18px 22px;margin:20px 0;}
  .banner .k{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--good);font-weight:700;margin-bottom:4px;}
  .banner p{margin:0;font-size:17px;}
  .glossary{display:grid;grid-template-columns:1fr;gap:10px;margin:14px 0;}
  .g{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;}
  .g .name{font-weight:700;color:var(--accent);}
  .g .where{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;
    color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:1px 8px;margin-left:8px;}
  .g .d{color:var(--muted);font-size:14px;margin-top:2px;}
  .rule{background:var(--bad-bg);border:1px solid #f0c8c2;border-radius:12px;padding:16px 20px;margin:20px 0;}
  .rule b{color:var(--bad);}
  figure{margin:22px 0;} .scroll{overflow-x:auto;}
  figcaption{font-size:13px;color:var(--muted);margin-top:8px;text-align:center;}
  .phase{display:flex;gap:14px;align-items:flex-start;margin:12px 0;}
  .phase .num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;}
  .phase .b{flex:1;} .phase .b .t{font-weight:700;}
  .phase.done .num{background:var(--good);}
  .q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin:14px 0;}
  .foot{margin-top:44px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;}
  a{color:var(--accent);}
  /* --- ADO structure tree (WS3 brief; appended to the frozen house style) --- */
  .ado{list-style:none;margin:14px 0;padding:0;}
  .ado ul{list-style:none;margin:0;padding-left:22px;}
  .ado li{border-left:2px solid var(--line);padding:4px 0 4px 14px;margin:6px 0;}
  .ado .node{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;}
  .ado .kind{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);}
  .verb{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;border-radius:20px;padding:1px 9px;}
  .verb.add{background:var(--good-bg);color:var(--good);}
  .verb.change{background:var(--accent-bg);color:var(--accent);}
  .verb.remove{background:var(--bad-bg);color:var(--bad);}
  .does{color:var(--muted);font-size:14px;margin:2px 0 0;}
  /* --- Session roster + worker ledger (task #463; data-gated provenance) --- */
  .roster{width:100%;border-collapse:collapse;margin:14px 0;font-size:13px;}
  .roster th,.roster td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);}
  .roster th{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);}
  .roster .ord{font-weight:700;color:var(--accent);}
  .roster .kind{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);}
  .ledger{list-style:none;margin:12px 0;padding:0;font-size:13px;}
  .ledger li{padding:4px 0;color:var(--muted);border-bottom:1px solid var(--line);}
  .ledger .act{font-weight:700;color:var(--accent);}
  .ledger .when{color:var(--muted);font-size:11px;}
</style>
</head>
<body>
<div class="wrap">{BODY}</div>
</body>
</html>
